server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve `be` at request time so the frontend survives backend restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://be:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # A live agent run waits on providers and Qwen; allow it to finish.
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    # Answers stream word by word; do not let nginx hold them back.
    location = /api/chat/stream {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
